<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unlock screens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #5f9470;
      --accent: #c8893a;
      --cream: #f0ead6;
      --disc: #1f2a1c;
      --bg: #0a0f08;
      --hero: 176px;
      --stage: 316px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px;
      background: #2a2a2a;
      font-family: "DM Sans", sans-serif;
    }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 44px;
      overflow: hidden;
      background: var(--bg);
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }
    .status {
      position: absolute;
      top: 14px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      color: var(--cream);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      z-index: 2;
    }
    .screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 36px 48px;
    }
    .cluster {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .kicker {
      margin-bottom: 22px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .hero-stage {
      width: var(--stage);
      height: var(--stage);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .glow {
      position: absolute;
      width: 232px;
      height: 232px;
      border-radius: 50%;
      background: rgba(200, 137, 58, 0.2);
    }
    .ray {
      position: absolute;
      inset: 0;
    }
    .ray span {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 1px;
      height: 42px;
      background: rgba(200, 137, 58, 0.32);
      transform-origin: center 140px;
    }
    .sparkle {
      position: absolute;
      left: 50%;
      top: 50%;
      color: var(--accent);
      line-height: 1;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .dot {
      position: absolute;
      left: 50%;
      top: 50%;
      background: var(--cream);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .ring {
      width: var(--hero);
      height: var(--hero);
      border-radius: 50%;
      border: 3px solid var(--accent);
      overflow: hidden;
      background: var(--disc);
      position: relative;
      z-index: 1;
    }
    .ring img {
      width: 100%;
      height: 112%;
      object-fit: cover;
      object-position: top;
    }
    .icon-fill {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--disc);
    }
    .title {
      margin-top: 10px;
      text-align: center;
      font-family: "Lora", serif;
      font-weight: 600;
      font-size: 28px;
      line-height: 34px;
      color: var(--cream);
    }
    .subtitle {
      margin-top: 6px;
      text-align: center;
      font-family: "Lora", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 15px;
      line-height: 20px;
      color: var(--primary);
    }
    .pill {
      margin-top: 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
    }
    .pill span {
      font-size: 12px;
      color: var(--cream);
    }
    .continue {
      margin-top: 22px;
      width: 100%;
      border-radius: 16px;
      padding: 14px 20px;
      text-align: center;
      background: var(--primary);
      color: var(--cream);
      font-size: 15px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="phone" id="species">
    <div class="status"><span>9:41</span><span>●●● Wi‑Fi</span></div>
    <div class="screen">
      <div class="cluster">
        <div class="kicker">New species</div>
        <div class="hero-stage" data-hero></div>
        <div class="title">American Robin</div>
        <div class="subtitle">Turdus migratorius</div>
        <div class="pill"><span>Species #12 on your life list</span></div>
        <div class="continue">Continue</div>
      </div>
    </div>
  </div>

  <div class="phone" id="badge">
    <div class="status"><span>9:41</span><span>●●● Wi‑Fi</span></div>
    <div class="screen">
      <div class="cluster">
        <div class="kicker">New badge</div>
        <div class="hero-stage" data-hero="badge"></div>
        <div class="title">Life List Builder</div>
        <div class="subtitle">Log 10 unique species</div>
        <div class="pill"><span>Life list</span></div>
        <div class="continue">Continue</div>
      </div>
    </div>
  </div>

  <script>
    const sparkles = [
      { x: -98, y: -72, size: 11, star: true },
      { x: 92, y: -64, size: 8, star: true },
      { x: -78, y: 70, size: 7, star: true },
      { x: 86, y: 78, size: 9, star: true },
      { x: 0, y: -108, size: 6, star: true },
      { x: -108, y: 8, size: 5, star: false },
      { x: 112, y: 14, size: 4, star: false },
      { x: -52, y: -96, size: 3, star: false },
      { x: 58, y: -100, size: 3, star: false },
      { x: -96, y: 48, size: 4, star: false },
      { x: 102, y: 52, size: 3, star: false },
      { x: 24, y: 104, size: 5, star: false },
    ];

    const feather = `
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="rgba(95,148,112,0.35)" stroke="#5f9470" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/>
        <path d="M16 8 2 22"/><path d="M17.5 15H9"/>
      </svg>
    `;

    document.querySelectorAll("[data-hero]").forEach((stage) => {
      const glow = document.createElement("div");
      glow.className = "glow";
      stage.appendChild(glow);

      const rays = document.createElement("div");
      rays.className = "ray";
      for (let i = 0; i < 16; i++) {
        const span = document.createElement("span");
        span.style.transform = `rotate(${i * 22.5}deg)`;
        rays.appendChild(span);
      }
      stage.appendChild(rays);

      sparkles.forEach((s) => {
        const el = document.createElement("div");
        el.className = s.star ? "sparkle" : "dot";
        el.style.transform = `translate(calc(-50% + ${s.x}px), calc(-50% + ${s.y}px))`;
        if (s.star) {
          el.style.fontSize = s.size + "px";
          el.textContent = "✦";
        } else {
          el.style.width = s.size + "px";
          el.style.height = s.size + "px";
        }
        stage.appendChild(el);
      });

      const ring = document.createElement("div");
      ring.className = "ring";
      if (stage.dataset.hero === "badge") {
        ring.innerHTML = `<div class="icon-fill">${feather}</div>`;
      } else {
        ring.innerHTML = `<img src="../app-store/nuthatch-hero.jpg" alt="Bird" onerror="this.src='../app-store/nuthatch.jpg'" />`;
      }
      stage.appendChild(ring);
    });
  </script>
</body>
</html>
